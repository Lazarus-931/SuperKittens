[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superkittens"
version = "0.1.0"
description = "Metal kernel library for transformer (and SSM) inference on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
tokenizer = ["sentencepiece>=0.2", "tokenizers>=0.20"]
hf       = ["huggingface_hub[cli]>=0.24", "transformers>=4.45"]
dev      = ["pytest>=8", "torch>=2.4"]

[project.urls]
Homepage = "https://github.com/Lazarus-931/SuperKittens"

[tool.setuptools]
packages = ["SuperKittens", "SuperKittens.inference", "SuperKittens.api", "SuperKittens.models", "SuperKittens.models.load", "SuperKittens.models.load.tokenizer"]
include-package-data = false

[tool.setuptools.package-data]
"SuperKittens" = ["**/*.metallib"]
